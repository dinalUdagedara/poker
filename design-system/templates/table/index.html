<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The table — Showdown</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body {
        min-height: 100vh;
      }
      .room {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .brand .suit {
        color: var(--color-accent-500);
        font-size: 15px;
      }
      .divider-v {
        width: 1px;
        height: 16px;
        background: var(--color-divider);
      }
      .table-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-2) var(--space-4);
      }
      .rail {
        width: 100%;
        max-width: 760px;
        aspect-ratio: 2 / 1;
      }
      .felt {
        position: relative;
      }
      .seat-at {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .middle {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }
      .mark-at {
        position: absolute;
        left: 50%;
        top: 79%;
        transform: translateX(-50%);
      }
      .piles {
        display: flex;
        align-items: flex-end;
        gap: 3px;
      }
      .stack {
        position: relative;
        display: block;
        width: 18px;
      }
      .stack .chip {
        position: absolute;
        left: 0;
        width: 18px;
        height: 9px;
        border-radius: 50%;
      }
      .stack .chip::after {
        inset: 2px 3px;
      }
      .near {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
        padding: 0 var(--space-4) var(--space-6);
      }
      .console {
        width: 100%;
        max-width: 640px;
        min-height: 208px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-4);
      }
      .avatar-a { background: conic-gradient(from 200deg, #facc15, #dc2626, #8b5cf6, #facc15); }
      .avatar-b { background: conic-gradient(from 40deg, #0ea5e9, #e5e5e5, #8b5cf6, #0ea5e9); }
      .avatar-c { background: conic-gradient(from 120deg, #dc2626, #facc15, #0ea5e9, #dc2626); }
      .avatar-d { background: conic-gradient(from 300deg, #8b5cf6, #0ea5e9, #facc15, #8b5cf6); }
      .avatar-you { background: conic-gradient(from 80deg, #facc15, #0ea5e9, #dc2626, #facc15); }
      .spotlight {
        position: absolute;
        inset: -14px -26px;
        border-radius: 50%;
        border: 1px dashed oklch(0.86 0.15 85 / 0.35);
        background: radial-gradient(closest-side, oklch(0.86 0.15 85 / 0.3), transparent);
        pointer-events: none;
      }
      .wager {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        padding: 1px var(--space-2) 1px 6px;
        border-radius: var(--radius-full);
        border: 1px solid oklch(0 0 0 / 0.35);
        background: oklch(0 0 0 / 0.45);
      }
      .wager .money {
        font-size: 11px;
        color: var(--color-accent-200);
      }
      details summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--color-muted);
        list-style: none;
      }
    </style>
  </head>
  <body>
    <div class="room">
      <header>
        <div class="brand">
          <span class="suit">&#9824;</span>
          <span class="wordmark" style="font-size: 17px">Showdown</span>
          <span class="divider-v"></span>
          <span class="muted" style="font-size: 13px">Hand 12</span>
        </div>
        <div class="row" style="gap: 6px">
          <span class="tag tag-mono">25/50</span>
          <span class="tag">flop</span>
          <button class="btn btn-icon" aria-label="What beats what">&#9827;</button>
          <button class="btn btn-icon" aria-label="How to play">?</button>
        </div>
      </header>

      <div class="table-wrap">
        <div class="rail">
          <div class="felt">
            <span class="felt-mark mark-at">Showdown</span>

            <!-- Pot and board -->
            <div class="middle">
              <div class="col" style="align-items: center; gap: 2px">
                <div class="piles" style="height: 32px">
                  <span class="stack" style="height: 21px">
                    <span class="chip chip-1000" style="bottom: 0"></span>
                    <span class="chip chip-1000" style="bottom: 4px"></span>
                    <span class="chip chip-1000" style="bottom: 8px"></span>
                    <span class="chip chip-1000" style="bottom: 12px"></span>
                  </span>
                  <span class="stack" style="height: 17px">
                    <span class="chip chip-100" style="bottom: 0"></span>
                    <span class="chip chip-100" style="bottom: 4px"></span>
                    <span class="chip chip-100" style="bottom: 8px"></span>
                  </span>
                </div>
                <span class="eyebrow" style="color: oklch(1 0 0 / 0.55)">Pot</span>
                <span class="money" style="font-size: 30px; font-weight: 700; text-shadow: 0 2px 4px oklch(0 0 0 / 0.6)">1,240</span>
              </div>
              <div class="row" style="gap: 6px">
                <span class="card-face">A<span class="suit">&#9824;</span></span>
                <span class="card-face card-red">K<span class="suit">&#9830;</span></span>
                <span class="card-face">7<span class="suit">&#9827;</span></span>
                <span class="card-slot"></span>
                <span class="card-slot"></span>
              </div>
            </div>

            <!-- Opponents, spread along the top arc -->
            <div class="seat-at" style="left: 7.7%; top: 57.6%">
              <div class="seat">
                <div class="seat-cards">
                  <span class="card-face card-sm card-back" style="transform: rotate(-6deg)"></span>
                  <span class="card-face card-sm card-back" style="transform: rotate(6deg); margin-left: -4px"></span>
                </div>
                <div class="seat-plate">
                  <span class="seat-avatar avatar-a"></span>
                  <span class="col" style="gap: 0">
                    <span class="seat-stack stack-healthy">2,150</span>
                    <span class="seat-name">Lucky Otter</span>
                  </span>
                </div>
                <span class="wager"><span class="chip chip-100" style="width: 14px; height: 14px"></span><span class="money">200</span></span>
              </div>
            </div>

            <div class="seat-at" style="left: 26.4%; top: 13.2%">
              <div class="seat">
                <span class="spotlight"></span>
                <div class="seat-cards">
                  <span class="card-face card-sm card-back" style="transform: rotate(-6deg)"></span>
                  <span class="card-face card-sm card-back" style="transform: rotate(6deg); margin-left: -4px"></span>
                </div>
                <div class="seat-plate seat-acting">
                  <span class="seat-avatar avatar-b"></span>
                  <span class="col" style="gap: 0">
                    <span class="seat-stack stack-medium">640</span>
                    <span class="seat-name">Bot 1</span>
                  </span>
                </div>
                <span class="callout" style="margin-top: 8px">thinking&hellip;</span>
              </div>
            </div>

            <div class="seat-at" style="left: 73.7%; top: 13.3%">
              <div class="seat">
                <div class="seat-cards hand-folded">
                  <span class="card-face card-sm card-back" style="transform: rotate(-6deg)"></span>
                  <span class="card-face card-sm card-back" style="transform: rotate(6deg); margin-left: -4px"></span>
                </div>
                <div class="seat-plate" style="opacity: 0.55">
                  <span class="seat-avatar avatar-c" style="filter: grayscale(1)"></span>
                  <span class="col" style="gap: 0">
                    <span class="seat-stack stack-short">180</span>
                    <span class="seat-name">Bot 2</span>
                  </span>
                </div>
                <span class="tag" style="margin-top: 6px">folded</span>
              </div>
            </div>

            <div class="seat-at" style="left: 92.3%; top: 57.6%">
              <div class="seat">
                <div class="seat-cards">
                  <span class="card-face card-sm card-back" style="transform: rotate(-6deg)"></span>
                  <span class="card-face card-sm card-back" style="transform: rotate(6deg); margin-left: -4px"></span>
                </div>
                <div class="seat-plate" style="position: relative">
                  <span class="dealer-button">D</span>
                  <span class="seat-avatar avatar-d"></span>
                  <span class="col" style="gap: 0">
                    <span class="seat-stack stack-healthy">3,030</span>
                    <span class="seat-name">Bot 3</span>
                  </span>
                </div>
                <span class="wager"><span class="chip chip-100" style="width: 14px; height: 14px"></span><span class="money">200</span></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- The near edge: your seat, then the console -->
      <div class="near">
        <div class="seat">
          <div class="seat-cards" style="margin-bottom: -16px">
            <span class="card-face card-lg" style="transform: rotate(-6deg)">A<span class="suit">&#9827;</span></span>
            <span class="card-face card-lg card-red" style="transform: rotate(6deg); margin-left: -8px">A<span class="suit">&#9830;</span></span>
          </div>
          <div class="seat-plate" style="padding: 8px var(--space-4)">
            <span class="seat-avatar avatar-you" style="width: 34px; height: 34px"></span>
            <span class="col" style="gap: 0">
              <span class="seat-stack stack-healthy" style="font-size: 16px">2,480</span>
              <span class="seat-name" style="font-size: 11px">You</span>
            </span>
          </div>
          <span class="wager"><span class="chip chip-100" style="width: 14px; height: 14px"></span><span class="money">200</span></span>
        </div>

        <div class="panel console">
          <div class="row between" style="gap: var(--space-4)">
            <button class="btn btn-secondary" style="height: 28px; font-size: 12px; font-weight: 400">&#9662;&nbsp; Bet size</button>
            <div class="row wrap" style="gap: 6px">
              <button class="btn btn-ghost" style="height: 28px; padding: 0 10px; font-size: 12px; font-weight: 400; border-color: var(--color-divider)">&frac12; pot</button>
              <button class="btn btn-ghost" style="height: 28px; padding: 0 10px; font-size: 12px; font-weight: 400; border-color: var(--color-divider)">&frac34; pot</button>
              <button class="btn" style="height: 28px; padding: 0 10px; font-size: 12px; font-weight: 400; background: oklch(0.8 0.135 82 / 0.14); border-color: oklch(0.8 0.135 82 / 0.5); color: var(--color-accent-200)">Pot</button>
              <button class="btn btn-ghost" style="height: 28px; padding: 0 10px; font-size: 12px; font-weight: 400; border-color: var(--color-divider)">All in</button>
            </div>
          </div>

          <div class="col" style="gap: 6px">
            <div style="position: relative; height: 22px">
              <span class="slider-bubble" style="position: absolute; left: 46%; transform: translateX(-50%)">620</span>
            </div>
            <div class="slider">
              <span class="slider-range" style="width: 46%"></span>
              <span class="slider-thumb" style="left: 46%"></span>
            </div>
            <div class="row between money" style="font-size: 10px; color: var(--color-muted); font-weight: 400">
              <span>400</span>
              <span>2,480</span>
            </div>
          </div>

          <div class="row" style="gap: var(--space-2)">
            <button class="play play-fold">Fold</button>
            <button class="play play-pass">Call 200</button>
            <button class="play play-commit">Raise to 620</button>
          </div>
        </div>

        <details style="width: 100%; max-width: 640px">
          <summary>Hand history</summary>
        </details>
      </div>
    </div>
  </body>
</html>
